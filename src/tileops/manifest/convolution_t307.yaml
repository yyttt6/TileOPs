# T307 isolated manifest. Not globally registered. Workloads copied byte-for-byte.

PointwiseConv2dOp:
  ref_api: torch.nn.functional.conv2d
  family: convolution
  status: implemented
  torch_compile_fullgraph: false
  signature:
    inputs:
      input:
        dtype: float16 | bfloat16
        shape: '[N, C_in, H, W]'
      weight:
        dtype: same_as(input)
        shape: '[C_out, C_in_g, kH, kW]'
      bias:
        dtype: same_as(input)
        shape: '[C_out]'
        optional: true
    outputs:
      output:
        dtype: same_as(input)
        shape: '[N, C_out, out_H, out_W]'
    params:
      stride:
        type: int | tuple[int, int]
        default: 1
      padding:
        type: int | tuple[int, int] | str
        default: 0
      dilation:
        type: int | tuple[int, int]
        default: 1
      groups:
        type: int
        default: 1
    shape_rules:
    - C_in % groups == 0
    - C_out % groups == 0
    - C_in_g == C_in // groups
    - _s_h == (stride[0] if isinstance(stride, (tuple, list)) else stride)
    - _s_w == (stride[1] if isinstance(stride, (tuple, list)) else stride)
    - _p_h == (padding[0] if isinstance(padding, (tuple, list)) else padding)
    - _p_w == (padding[1] if isinstance(padding, (tuple, list)) else padding)
    - _d_h == (dilation[0] if isinstance(dilation, (tuple, list)) else dilation)
    - _d_w == (dilation[1] if isinstance(dilation, (tuple, list)) else dilation)
    - not isinstance(_p_h, str) or _p_h in ('valid', 'same')
    - not isinstance(_p_w, str) or _p_w in ('valid', 'same')
    - _p_h != 'same' or _s_h == 1
    - _p_w != 'same' or _s_w == 1
    - out_H == (H if _p_h == 'same' else (H + 2 * (0 if _p_h == 'valid' else _p_h) - _d_h * (kH - 1) - 1) // _s_h
      + 1)
    - out_W == (W if _p_w == 'same' else (W + 2 * (0 if _p_w == 'valid' else _p_w) - _d_w * (kW - 1) - 1) // _s_w
      + 1)
    - kH == 1 and kW == 1
  # D059 predicate: kH == 1 and kW == 1
  # Donor: convolution.yaml::Conv2dFwdOp; selected labels:
  #   resnet-1x1
  #   bottleneck-expand-1x1
  #   bottleneck-reduce-1x1
  #   late-stage-1x1
  #   classifier-1x1
  #   resnet-1x1-bias
  #   bottleneck-expand-1x1-bias
  #   bottleneck-reduce-1x1-bias
  #   late-stage-1x1-bias
  #   classifier-1x1-bias
  # Donor symbols N,C_in,H,W,C_out,kH,kW retain their forward meaning.
  # groups defaults to 1; stride to 1; padding to 0; dilation to 1, per donor signature.
  # Pair normalization repeats scalars on both spatial axes.
  # C_in_g=C_in/groups; C_out_g=C_out/groups.
  # out_H=(H+2*pH-dH*(kH-1)-1)//sH+1; likewise out_W.
  # Workload fields remain donor metadata; adapter derives actual tensor roles below.
  # No performance predicate, additional rows or dtype changes.
  # Forward donor tensor roles and all parameter values remain unchanged.
  workloads:
    - {input_shape: [2, 64, 56, 56], C_out: 256, kH: 1, kW: 1, stride: [1, 1], padding: [0, 0], dtypes: [float16, bfloat16], label: "resnet-1x1"}
    - {input_shape: [2, 128, 28, 28], C_out: 512, kH: 1, kW: 1, stride: [1, 1], padding: [0, 0], dtypes: [float16], label: "bottleneck-expand-1x1"}
    - {input_shape: [2, 512, 28, 28], C_out: 128, kH: 1, kW: 1, stride: [1, 1], padding: [0, 0], dtypes: [float16], label: "bottleneck-reduce-1x1"}
    - {input_shape: [1, 256, 14, 14], C_out: 1024, kH: 1, kW: 1, stride: [1, 1], padding: [0, 0], dtypes: [float16], label: "late-stage-1x1"}
    - {input_shape: [1, 512, 7, 7], C_out: 2048, kH: 1, kW: 1, stride: [1, 1], padding: [0, 0], dtypes: [float16], label: "classifier-1x1"}
    - {input_shape: [2, 64, 56, 56], C_out: 256, kH: 1, kW: 1, stride: [1, 1], padding: [0, 0], dtypes: [float16, bfloat16], bias_shape: [256], label: "resnet-1x1-bias"}
    - {input_shape: [2, 128, 28, 28], C_out: 512, kH: 1, kW: 1, stride: [1, 1], padding: [0, 0], dtypes: [float16], bias_shape: [512], label: "bottleneck-expand-1x1-bias"}
    - {input_shape: [2, 512, 28, 28], C_out: 128, kH: 1, kW: 1, stride: [1, 1], padding: [0, 0], dtypes: [float16], bias_shape: [128], label: "bottleneck-reduce-1x1-bias"}
    - {input_shape: [1, 256, 14, 14], C_out: 1024, kH: 1, kW: 1, stride: [1, 1], padding: [0, 0], dtypes: [float16], bias_shape: [1024], label: "late-stage-1x1-bias"}
    - {input_shape: [1, 512, 7, 7], C_out: 2048, kH: 1, kW: 1, stride: [1, 1], padding: [0, 0], dtypes: [float16], bias_shape: [2048], label: "classifier-1x1-bias"}

  roofline:
    vars:
      has_bias: bias is not None
    flops: 2 * N * C_out * out_H * out_W * C_in_g * kH * kW + (N * C_out * out_H * out_W if has_bias else 0)
    bytes: (N * C_in * H * W + C_out * C_in_g * kH * kW + N * C_out * out_H * out_W + (C_out if has_bias else 0))
      * elem_bytes
  source:
    kernel: src/tileops/ops/conv_variants/kernels.py
    op: src/tileops/ops/conv_variants/ops.py
    adapter: src/tileops/ops/conv_variants/adapters.py
    test: docs/reports/R307-data/correctness.py
    bench: ../tileops-ascend-harness/bench1.py
    bench_manifest_driven: true

