# T301C GEMM variants. Workload entry lines are verbatim donor copies.
# Quantized input variants interpret dtypes as output/activation precision.
# GEMV uses donor M/K; N is retained metadata, not an extra vector axis.
StridedBatchedGemmFwdOp:
  ref_api: none
  family: gemm
  status: implemented
  signature:
    inputs:
      a:
        dtype: float16 | bfloat16
        shape: '[B,M,K]'
      b:
        dtype: same_as(a)
    outputs:
      c:
        dtype: same_as(a)
    params:
      stride_a:
        type: int | None
        default: null
      stride_b:
        type: int
        default: 0
    shape_rules:
    - a.shape[2] == b.shape[-2]
    - c.shape == (a.shape[0], a.shape[1], b.shape[-1])

  workloads:
  # VERBATIM bmm.yaml::BmmFwdOp.workloads, every entry and dtype.
  - {b: 8, m: 128, n: 128, k: 128, dtypes: [float16, bfloat16], label: "small-b8-128"}
  - {b: 8, m: 1024, n: 1024, k: 1024, dtypes: [float16, bfloat16], label: "square-b8-1k"}
  - {b: 16, m: 512, n: 512, k: 512, dtypes: [float16, bfloat16], label: "square-b16-512"}
  - {b: 32, m: 256, n: 256, k: 256, dtypes: [float16, bfloat16], label: "square-b32-256"}
  - {b: 4, m: 4096, n: 4096, k: 4096, dtypes: [bfloat16], label: "square-b4-4k"}
  - {b: 8, m: 2048, n: 2048, k: 2048, dtypes: [float16, bfloat16], label: "square-b8-2k"}
  - {b: 64, m: 128, n: 2048, k: 128, dtypes: [float16, bfloat16], label: "mha-decode-b64-qk"}
  - {b: 64, m: 128, n: 128, k: 2048, dtypes: [float16, bfloat16], label: "mha-decode-b64-pv"}
  - {b: 128, m: 512, n: 512, k: 2048, dtypes: [bfloat16], label: "moe-prefill-b128"}

  roofline:
    func: tileops.ops.gemm.variants.variant_roofline
  source:
    kernel: src/tileops/kernels/gemm.py
    op: tileops/ops/gemm/variants.py
    test: null
    bench: null
    bench_manifest_driven: true

