        dtype: same_as(x)
    params:
      eps:
        type: float
        default: 1.0e-05
    shape_rules:
    - x.ndim >= 2
    - weight.shape == (x.shape[1],)
    - bias.shape == weight.shape
    - running_mean.shape == weight.shape
    - running_var.shape == weight.shape
    - output.shape == x.shape

  # workloads copied byte-for-byte from normalization.yaml / BatchNormFwdOp
