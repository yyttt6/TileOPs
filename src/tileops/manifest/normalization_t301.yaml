SpectralNormPowerIterFwdOp:
  ref_api: none
  family: normalization
  status: implemented
  signature:
    inputs:
      x:
        dtype: float32 | float16 | bfloat16
      u:
        dtype: float32
      v:
        dtype: float32
    outputs:
      sigma:
        dtype: float32
      u_out:
        dtype: float32
      v_out:
        dtype: float32
    params:
      normalized_shape:
        type: list[int] | tuple[int, ...]
      n_iter:
        type: int
        default: 1
      eps:
        type: float
        default: 1.0e-12
    shape_rules:
    - len(normalized_shape) > 0
    - tuple(x.shape[-len(normalized_shape):]) == tuple(normalized_shape)
    - x.ndim == 2
    - n_iter >= 0
    - u.shape == (x.shape[0],)
    - v.shape == (x.shape[1],)
    - sigma.shape == ()
    - u_out.shape == u.shape
    - v_out.shape == v.shape
  # Complete RMSNorm workloads reused as O-by-I matrices; normalized_shape validates I and does not change matrix semantics.

  # workloads copied byte-for-byte from normalization.yaml / RMSNormFwdOp
  workloads:
    # Llama-3.1-8B (hidden_dim=4096)
    - {x_shape: [2048, 4096], normalized_shape: [4096], dtypes: [float16, bfloat16], label: "llama-8b-prefill"}
    - {x_shape: [1, 4096], normalized_shape: [4096], dtypes: [bfloat16], label: "llama-8b-decode"}
    # Llama-3.1-70B (hidden_dim=8192)
    - {x_shape: [2048, 8192], normalized_shape: [8192], dtypes: [float16, bfloat16], label: "llama-70b-prefill"}
    - {x_shape: [1, 8192], normalized_shape: [8192], dtypes: [bfloat16], label: "llama-70b-decode"}
    # Llama-3.1-405B (hidden_dim=16384)
    - {x_shape: [2048, 16384], normalized_shape: [16384], dtypes: [float16, bfloat16], label: "llama-405b-prefill"}
    - {x_shape: [1, 16384], normalized_shape: [16384], dtypes: [bfloat16], label: "llama-405b-decode"}

  roofline:
    vars: {}
    flops: (4 * n_iter + 2) * product(x.shape) + (4 * n_iter + 2) * (x.shape[0] + x.shape[1])
    bytes: product(x.shape) * elem_bytes + 8 * (x.shape[0] + x.shape[1]) + 4
  source:
    kernel: src/tileops/ops/norm/t301_primitives.py
    op: tileops/ops/norm/t301.py
    test: ../docs/reports/R301B-data/resumed/validate.py
    bench: ../docs/reports/R301B-data/resumed/validate.py
    bench_manifest_driven: false
