  # PROJECT_STATE 13.134 (PM ruling, 2026-09-08) -- REFERENCE EXCEPTION, fp32 only.
  # ``ref_api: torch.asin`` above is NOT usable as an fp32 reference on this device:
  # ``torch.asin`` on the NPU deviates from a float64 reference by up to 5.6e-5, peaking
  # at |x| = 1/sqrt(2), while this kernel stays at 4.4e-7 (asin) / 8.5e-7 (acos) over the
  # whole 4096x4096 manifest case -- R270 measured all three sides on one input,
  # docs/reports/R270-data/10-asin-acos-fp64-reference.txt; first seen in
  # docs/reports/R263-data/05-asin-fp64-cross-check.txt (3.5e-7 over |x| in [0.6, 0.8])
