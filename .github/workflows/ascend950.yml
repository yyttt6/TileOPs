name: Ascend 950
on:
  push:
    branches: [ascend950-v0.1.0]
  pull_request:
    branches: [ascend950-v0.1.0]
  # Daily NPU regression is owned by the official website nightly (02:00 Shanghai).
  workflow_dispatch:
    inputs:
      mode:
        description: CPU, selected operator correctness, or full registered-operator regression
        type: choice
        options: [cpu, correctness, regression, performance]
        default: cpu
      revision:
        description: Commit SHA or PR head ref to verify (blank uses this branch)
        default: ''
      operators:
        description: Comma-separated manifest op names for correctness
        default: ''
permissions:
  contents: read
concurrency:
  group: ascend950-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.revision || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ascend950-v0.1.0
          path: ci-harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yyttt6/TileOPs.github.io
          ref: 8cc05d7b4d1bfb4f07ed9109d8e6ea71f0791c65
          path: baseline-cache
          persist-credentials: false
      - name: Package exact sources for isolated runners
        run: |
          echo "f0b3227010d03c4ae9781d50272cf00d433b979a6909b5b10e5a4bcc113919ea  baseline-cache/data/baseline-cache/snapshot.json" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ci-sources"
          git rev-parse HEAD > "$RUNNER_TEMP/ci-sources/source.commit"
          git archive --format=tar HEAD > "$RUNNER_TEMP/ci-sources/source.tar"
          tar -rf "$RUNNER_TEMP/ci-sources/source.tar" .git
          gzip "$RUNNER_TEMP/ci-sources/source.tar"
          git -C ci-harness archive --format=tar.gz HEAD > "$RUNNER_TEMP/ci-sources/harness.tar.gz"
          git -C baseline-cache archive --format=tar.gz HEAD data/baseline-cache > "$RUNNER_TEMP/ci-sources/baseline.tar.gz"
          cd "$RUNNER_TEMP/ci-sources"
          sha256sum source.commit source.tar.gz harness.tar.gz baseline.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ascend950-sources
          path: ${{ runner.temp }}/ci-sources
          overwrite: true
          if-no-files-found: error
          retention-days: 7
  preflight:
    needs: sources
    runs-on: [self-hosted, tileops-cpu-server2]
    timeout-minutes: 30
    env:
      TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
      CXX: /opt/tileops-ci/server2-20261030/compiler/usr/bin/g++-12
      TORCHINDUCTOR_CACHE_DIR: /opt/tileops-ci/server2-20261030/cache/v010-cpu-inductor
      TORCH_EXTENSIONS_DIR: /opt/tileops-ci/server2-20261030/cache/v010-cpu-extensions
      TRITON_CACHE_DIR: /opt/tileops-ci/server2-20261030/cache/v010-cpu-triton
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ascend950-sources
          path: ${{ runner.temp }}/ci-archives-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: Unpack verified sources
        env:
          ARCHIVES: ${{ runner.temp }}/ci-archives-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          DESTINATION: ${{ runner.temp }}/ci-v010-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          cd "$ARCHIVES"
          sha256sum --check SHA256SUMS
          mkdir -p "$DESTINATION"
          tar --no-same-owner -xzf source.tar.gz -C "$DESTINATION"
          test "$(git -C "$DESTINATION" rev-parse HEAD)" = "$(cat source.commit)"
          test -z "$(git -C "$DESTINATION" status --porcelain)"
      - name: Check canonical compiler profile without device initialization
        working-directory: ${{ runner.temp }}/ci-v010-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          source /opt/tileops-ci/server2-20261030/config/toolchain-v1.env.sh
          python /opt/tileops-ci/server2-20261030/config/check-toolchain-v1.py --lock /opt/tileops-ci/server2-20261030/config/toolchain-v1.lock.json --output "$RUNNER_TEMP/toolchain-cpu.json"
      - name: Baseline contract matching regression (CPU only)
        working-directory: ${{ runner.temp }}/ci-v010-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: python scripts/ci/test_pr_baseline_contract.py
      - name: Measured-output correctness regression (CPU only)
        working-directory: ${{ runner.temp }}/ci-v010-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: PYTHONPATH=.:src python -m pytest scripts/ci/tests -q
      - name: CPU contracts (NPU autoload disabled)
        working-directory: ${{ runner.temp }}/ci-v010-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: python scripts/ci/ascend950.py --phase cpu --output "$RUNNER_TEMP/cpu-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ascend950-cpu
          path: ${{ runner.temp }}/cpu-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ascend950-toolchain-cpu
          path: ${{ runner.temp }}/toolchain-cpu.json
  pr-performance:
    needs: preflight
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'performance')
    runs-on: [self-hosted, tileops-npu-server2, ascend950-32core]
    timeout-minutes: 720
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ascend950-sources
          path: ${{ runner.temp }}/ci-archives-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: Unpack verified sources
        env:
          ARCHIVES: ${{ runner.temp }}/ci-archives-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          DESTINATION: ${{ runner.temp }}/ci-v010-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          cd "$ARCHIVES"
          sha256sum --check SHA256SUMS
          mkdir -p "$DESTINATION"
          tar --no-same-owner -xzf source.tar.gz -C "$DESTINATION"
          test "$(git -C "$DESTINATION" rev-parse HEAD)" = "$(cat source.commit)"
          test -z "$(git -C "$DESTINATION" status --porcelain)"
          mkdir -p "$DESTINATION/ci-harness" "$DESTINATION/baseline-cache"
          tar --no-same-owner -xzf harness.tar.gz -C "$DESTINATION/ci-harness"
          tar --no-same-owner -xzf baseline.tar.gz -C "$DESTINATION/baseline-cache"
      - name: Verify published baseline snapshot
        working-directory: ${{ runner.temp }}/ci-v010-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          echo "f0b3227010d03c4ae9781d50272cf00d433b979a6909b5b10e5a4bcc113919ea  baseline-cache/data/baseline-cache/snapshot.json" | sha256sum --check
      - name: Changed operator performance with final-output correctness
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha || 'origin/ascend950-v0.1.0' }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        working-directory: ${{ runner.temp }}/ci-v010-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -eo pipefail
          source /opt/tileops-ci/server2-20261030/config/prepare-python.sh "$PWD"
          source /opt/tileops-ci/server2-20261030/config/toolchain-v1.env.sh
          export OMP_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4
          TORCH_DEVICE_BACKEND_AUTOLOAD=0 python /opt/tileops-ci/server2-20261030/config/check-toolchain-v1.py --lock /opt/tileops-ci/server2-20261030/config/toolchain-v1.lock.json --output "$RUNNER_TEMP/pr-toolchain.json"
          # PR events test a synthetic merge. Its first parent is the base actually
          # tested, which may be newer than the event payload's base SHA.
          if [[ -n "$PR_HEAD" ]]; then
            read -r -a parents <<< "$(git show -s --format=%P HEAD)"
            [[ "${#parents[@]}" -eq 2 && "${parents[1]}" == "$PR_HEAD" ]] || { echo "Unexpected PR merge parents" >&2; exit 1; }
            PR_BASE="${parents[0]}"
          fi
          git rev-parse "$PR_BASE^{commit}" > "$RUNNER_TEMP/pr-selection-base.txt"
          # Prefer the trusted harness; candidate fallback bootstraps this CPU-only
          # helper for its introducing PR. The measurement harness stays trusted.
          CACHE_KEY_SCRIPT=ci-harness/scripts/ci/tilelang_cache_key.py
          if [[ ! -f "$CACHE_KEY_SCRIPT" ]]; then CACHE_KEY_SCRIPT=scripts/ci/tilelang_cache_key.py; fi
          TILELANG_CACHE_KEY="$(python "$CACHE_KEY_SCRIPT" --source "$PWD" --lock /opt/tileops-ci/server2-20261030/config/toolchain-v1.lock.json --verified-toolchain "$RUNNER_TEMP/pr-toolchain.json" --output "$RUNNER_TEMP/pr-cache.json")"
          export TILELANG_CACHE_DIR="/opt/tileops-ci/server2-20261030/cache/tilelang-v1-${TILELANG_CACHE_KEY}"
          mkdir -p "$TILELANG_CACHE_DIR"
          python ci-harness/scripts/ci/pr_performance.py --base "$PR_BASE" --baseline baseline-cache/data/baseline-cache/snapshot.json --output "/opt/tileops-ci/server2-20261030/pr-evidence-v010/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ascend950-pr-performance
          path: |
            /opt/tileops-ci/server2-20261030/pr-evidence-v010/${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/pr-toolchain.json
            ${{ runner.temp }}/pr-cache.json
            ${{ runner.temp }}/pr-selection-base.txt
          retention-days: 90
  device:
    needs: preflight
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'cpu' && inputs.mode != 'performance')
    runs-on: [self-hosted, tileops-npu-server2, ascend950-32core]
    timeout-minutes: 180
    concurrency:
      group: ascend950-device
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ascend950-sources
          path: ${{ runner.temp }}/ci-archives-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: Unpack verified sources
        env:
          ARCHIVES: ${{ runner.temp }}/ci-archives-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          DESTINATION: ${{ runner.temp }}/ci-v010-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          cd "$ARCHIVES"
          sha256sum --check SHA256SUMS
          mkdir -p "$DESTINATION"
          tar --no-same-owner -xzf source.tar.gz -C "$DESTINATION"
          test "$(git -C "$DESTINATION" rev-parse HEAD)" = "$(cat source.commit)"
          test -z "$(git -C "$DESTINATION" status --porcelain)"
      - name: Correctness under the host NPU reservation
        env:
          CI_MODE: ${{ inputs.mode || 'regression' }}
          CI_OPERATORS: ${{ inputs.operators }}
        working-directory: ${{ runner.temp }}/ci-v010-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -eo pipefail
          source /opt/tileops-ci/server2-20261030/config/prepare-python.sh "$PWD"
          source /opt/tileops-ci/server2-20261030/config/toolchain-v1.env.sh
          TORCH_DEVICE_BACKEND_AUTOLOAD=0 python /opt/tileops-ci/server2-20261030/config/check-toolchain-v1.py --lock /opt/tileops-ci/server2-20261030/config/toolchain-v1.lock.json --output "$RUNNER_TEMP/toolchain-npu.json"
          python /opt/tileops-ci/server2-20261030/config/device-job.py "$PWD" "$RUNNER_TEMP/device-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ascend950-device
          path: ${{ runner.temp }}/device-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ascend950-toolchain-npu
          path: ${{ runner.temp }}/toolchain-npu.json
