name: Ascend 950
on:
  push:
    branches: [ascend950]
  pull_request:
    branches: [ascend950]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: CPU, selected operator correctness, or full registered-operator regression
        type: choice
        options: [cpu, correctness, regression]
        default: cpu
      revision:
        description: Commit SHA or PR head ref to verify (blank uses this branch)
        default: ''
      operators:
        description: Comma-separated manifest op names for correctness
        default: ''
permissions:
  contents: read
concurrency:
  group: ascend950-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  preflight:
    runs-on: [self-hosted, tileops-cpu-docker]
    timeout-minutes: 30
    env:
      TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: CPU contracts (container has no NPU devices)
        run: python scripts/ci/ascend950.py --phase cpu --output "$RUNNER_TEMP/cpu-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ascend950-cpu
          path: ${{ runner.temp }}/cpu-${{ github.run_id }}-${{ github.run_attempt }}
  device:
    needs: preflight
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'cpu')
    runs-on: [self-hosted, tileops-npu-docker]
    timeout-minutes: 180
    concurrency:
      group: ascend950-device
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Correctness under the host NPU reservation
        env:
          CI_MODE: ${{ inputs.mode || 'regression' }}
          CI_OPERATORS: ${{ inputs.operators }}
        run: |
          set -eo pipefail
          source /ci/device-env.sh
          python /ci/device-job.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/device-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ascend950-device
          path: ${{ runner.temp }}/device-${{ github.run_id }}-${{ github.run_attempt }}
