name: Ascend 950
on:
  push:
    branches: [ascend950-v0.1.0]
  pull_request:
    branches: [ascend950-v0.1.0]
  # Daily NPU regression is owned by the official website nightly (02:00 Shanghai).
  workflow_dispatch:
    inputs:
      mode:
        description: CPU, selected operator correctness, or full registered-operator regression
        type: choice
        options: [cpu, correctness, regression, performance]
        default: cpu
      revision:
        description: Commit SHA or PR head ref to verify (blank uses this branch)
        default: ''
      operators:
        description: Comma-separated manifest op names for correctness
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: ascend950-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.revision || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      performance_required: ${{ steps.selection.outputs.performance_required }}
      archive_digest: ${{ steps.package.outputs.archive_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ascend950-v0.1.0
          path: ci-harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yyttt6/TileOPs.github.io
          ref: 63c58f4738f484009b6ae4d9da660212177663a8
          path: baseline-cache
          sparse-checkout: data/baseline-cache
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yyttt6/tileops-ascend-baselines
          ref: 0eede2e36cfdc4b2c8a831c48d2e1e8c76d9bf2b
          path: additional-baselines
          sparse-checkout: catalog/upstream12-20261125
          persist-credentials: false
      - name: Select affected operators without a device
        id: selection
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'performance')
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha || 'origin/ascend950-v0.1.0' }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MANUAL_OPERATORS: ${{ github.event_name == 'workflow_dispatch' && inputs.operators || '' }}
        run: |
          SELECTOR=ci-harness/scripts/ci/early_selection.py
          if [[ ! -f "$SELECTOR" ]]; then SELECTOR=scripts/ci/early_selection.py; fi
          python "$SELECTOR" --source "$PWD" --base "$PR_BASE" --pr-head "$PR_HEAD" --output "$RUNNER_TEMP/operator-selection.json" --github-output "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "$MANUAL_OPERATORS" ]]; then
            echo "performance_required=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.selection.outcome == 'success'
        with:
          name: ascend950-operator-selection
          path: ${{ runner.temp }}/operator-selection.json
          if-no-files-found: error
      - name: Locate reusable checkpoints from the same pull request
        if: github.event_name == 'pull_request' && steps.selection.outputs.performance_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PREVIOUS_HEAD: ${{ github.event.before }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.id }}
        run: |
          set -euo pipefail
          # Only completed Actions runs linked to this PR can supply checkpoint records.
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ascend950.yml/runs" \
            -f branch="$PR_BRANCH" -f event=pull_request -f status=completed -F per_page=20 > "$RUNNER_TEMP/previous-pr-runs.json"
          while read -r id; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" > "$RUNNER_TEMP/previous-artifacts.json"
            item=$(jq -rc '[.artifacts[] | select(.expired == false and (.name == "ascend950-pr-performance" or (.name | startswith("ascend950-pr-checkpoints-"))))] | sort_by([(.name | startswith("ascend950-pr-checkpoints-")), .id]) | last // empty' "$RUNNER_TEMP/previous-artifacts.json")
            [[ -n "$item" ]] || continue
            artifact=$(jq -er .id <<< "$item")
            sha=$(jq -er .digest <<< "$item")
            [[ "$sha" =~ ^sha256:[0-9a-f]{64}$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/prior-checkpoints.zip"
            CHECKPOINTS=ci-harness/.github/ci/pr_checkpoints.py
            if [[ ! -f "$CHECKPOINTS" ]]; then CHECKPOINTS=.github/ci/pr_checkpoints.py; fi
            echo "e8b3280f7f1eee6b5a3e4f0fd2e0d9f3229db8b46b8e4fbc7992b9a92c02ce18  $CHECKPOINTS" | sha256sum --check
            env -u GH_TOKEN python -I -S "$CHECKPOINTS" index "$RUNNER_TEMP/prior-checkpoints.zip" "$sha" "$RUNNER_TEMP/prior-checkpoints.json"
            echo "Prepared checkpoint index from run $id, artifact $artifact"
            break
          done < <(jq -r --argjson pr "$PR_NUMBER" --argjson current "$GITHUB_RUN_ID" --arg before "$PREVIOUS_HEAD" --argjson repo "$HEAD_REPO" '.workflow_runs[] | select(.id < $current and .conclusion != "success" and .head_repository.id == $repo and (any(.pull_requests[]?; .number == $pr) or .head_sha == $before)) | .id' "$RUNNER_TEMP/previous-pr-runs.json")
      - name: Package exact sources for isolated runners
        id: package
        run: |
          echo "db51780b276fff5ca6dc60e11e2cbc30d5035fa42ca5066218deb463b3350fb0  baseline-cache/data/baseline-cache/snapshot.json" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ci-sources"
          git rev-parse HEAD > "$RUNNER_TEMP/ci-sources/source.commit"
          git archive --format=tar HEAD > "$RUNNER_TEMP/ci-sources/source.tar"
          tar -rf "$RUNNER_TEMP/ci-sources/source.tar" .git
          gzip "$RUNNER_TEMP/ci-sources/source.tar"
          git -C ci-harness archive --format=tar.gz HEAD > "$RUNNER_TEMP/ci-sources/harness.tar.gz"
          mkdir -p "$RUNNER_TEMP/ci-sources/baseline-layout/data/baseline-cache"
          ADDITION=additional-baselines/catalog/upstream12-20261125/isolated-release.json
          echo "396d17858f19968a483d2f4c575add11bf2bff2f1da061da2175cd9b4920b640  $ADDITION" | sha256sum --check
          COMPOSER=ci-harness/scripts/ci/compose_baselines.py
          if [[ ! -f "$COMPOSER" ]]; then COMPOSER=scripts/ci/compose_baselines.py; fi
          echo "f1089cca9cb95dc8113381ff718d327845ba818514e1929bbe6dc5c2c4e23394  $COMPOSER" | sha256sum --check
          python -I -S "$COMPOSER" baseline-cache/data/baseline-cache "$ADDITION" "$RUNNER_TEMP/ci-sources/baseline-layout/data/baseline-cache"
          echo "1ca42118cf451200aa0f0aa75d1880501c6832132aa838aedacf0886872a52da  $RUNNER_TEMP/ci-sources/baseline-layout/data/baseline-cache/snapshot.json" | sha256sum --check
          if [[ -f "$RUNNER_TEMP/prior-checkpoints.json" ]]; then
            cp "$RUNNER_TEMP/prior-checkpoints.json" "$RUNNER_TEMP/ci-sources/baseline-layout/data/baseline-cache/prior-checkpoints.json"
          fi
          tar -czf "$RUNNER_TEMP/ci-sources/baseline.tar.gz" -C "$RUNNER_TEMP/ci-sources/baseline-layout" data/baseline-cache
          cd "$RUNNER_TEMP/ci-sources"
          sha256sum source.commit source.tar.gz harness.tar.gz baseline.tar.gz > SHA256SUMS
          echo "archive_digest=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ascend950-sources
          path: ${{ runner.temp }}/ci-sources
          overwrite: true
          if-no-files-found: error
          retention-days: 7
  preflight:
    needs: sources
    runs-on: [self-hosted, tileops-cpu-server2]
    timeout-minutes: 30
    env:
      TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
      CXX: /opt/tileops-ci/server2-20261030/compiler/usr/bin/g++-12
      TORCHINDUCTOR_CACHE_DIR: /opt/tileops-ci/server2-20261030/cache/v010-cpu-inductor
      TORCH_EXTENSIONS_DIR: /opt/tileops-ci/server2-20261030/cache/v010-cpu-extensions
      TRITON_CACHE_DIR: /opt/tileops-ci/server2-20261030/cache/v010-cpu-triton
    steps:
      - name: Restore checksum-verified source archives from this host
        id: archive-cache
        env:
          ARCHIVE_DIGEST: ${{ needs.sources.outputs.archive_digest }}
          ARCHIVES: ${{ runner.temp }}/ci-archives-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          CACHE_ROOT: /opt/tileops-ci/server2-20261030/cache/source-archives-v1
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, re
          hit = False
          try:
              digest = os.environ["ARCHIVE_DIGEST"]
              if not re.fullmatch(r"[0-9a-f]{64}", digest): raise ValueError("Invalid manifest digest")
              entry = pathlib.Path(os.environ["CACHE_ROOT"]) / digest
              manifest = (entry / "SHA256SUMS").read_bytes()
              if hashlib.sha256(manifest).hexdigest() != digest: raise ValueError("Manifest checksum mismatch")
              entries = [line.split() for line in manifest.decode().splitlines()]
              expected = {"source.commit", "source.tar.gz", "harness.tar.gz", "baseline.tar.gz"}
              if len(entries) != 4 or any(len(e) != 2 for e in entries) or {e[1] for e in entries} != expected:
                  raise ValueError("Unexpected archive members")
              payload = {name: (entry / name).read_bytes() for _, name in entries}
              if any(hashlib.sha256(payload[name]).hexdigest() != sha for sha, name in entries):
                  raise ValueError("Archive checksum mismatch")
              destination = pathlib.Path(os.environ["ARCHIVES"])
              destination.mkdir(parents=True, exist_ok=True)
              for name, content in {**payload, "SHA256SUMS": manifest}.items():
                  (destination / name).write_bytes(content)
              hit = True
          except (OSError, ValueError, UnicodeError) as exc:
              print(f"Source archive cache miss: {exc}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"hit={str(hit).lower()}\n")
          PY
      - uses: actions/download-artifact@v4
        if: steps.archive-cache.outputs.hit != 'true'
        with:
          name: ascend950-sources
          path: ${{ runner.temp }}/ci-archives-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: Unpack verified sources
        env:
          ARCHIVE_DIGEST: ${{ needs.sources.outputs.archive_digest }}
          ARCHIVES: ${{ runner.temp }}/ci-archives-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          DESTINATION: ${{ runner.temp }}/ci-v010-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          cd "$ARCHIVES"
          echo "$ARCHIVE_DIGEST  SHA256SUMS" | sha256sum --check
          sha256sum --check SHA256SUMS
          mkdir -p "$DESTINATION"
          tar --no-same-owner -xzf source.tar.gz -C "$DESTINATION"
          test "$(git -C "$DESTINATION" rev-parse HEAD)" = "$(cat source.commit)"
          test -z "$(git -C "$DESTINATION" status --porcelain)"
          mkdir -p "$DESTINATION/ci-harness"
          tar --no-same-owner -xzf harness.tar.gz -C "$DESTINATION/ci-harness"
      - name: Publish verified archives to this host cache
        continue-on-error: true
        working-directory: ${{ runner.temp }}/ci-v010-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        env:
          ARCHIVE_DIGEST: ${{ needs.sources.outputs.archive_digest }}
          ARCHIVES: ${{ runner.temp }}/ci-archives-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          CACHE_HELPER=ci-harness/scripts/ci/artifact_cache.py
          if [[ ! -f "$CACHE_HELPER" ]]; then CACHE_HELPER=scripts/ci/artifact_cache.py; fi
          python "$CACHE_HELPER" --archives "$ARCHIVES" --cache-root /opt/tileops-ci/server2-20261030/cache/source-archives-v1 --digest "$ARCHIVE_DIGEST"
      - name: Check canonical compiler profile without device initialization
        working-directory: ${{ runner.temp }}/ci-v010-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          source /opt/tileops-ci/server2-20261030/config/toolchain-v1.env.sh
          python /opt/tileops-ci/server2-20261030/config/check-toolchain-v1.py --lock /opt/tileops-ci/server2-20261030/config/toolchain-v1.lock.json --output "$RUNNER_TEMP/toolchain-cpu.json"
      - name: Baseline contract matching regression (CPU only)
        working-directory: ${{ runner.temp }}/ci-v010-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: python scripts/ci/test_pr_baseline_contract.py
      - name: Measured-output correctness regression (CPU only)
        working-directory: ${{ runner.temp }}/ci-v010-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: PYTHONPATH=.:src python -m pytest scripts/ci/tests -q
      - name: CPU contracts (NPU autoload disabled)
        working-directory: ${{ runner.temp }}/ci-v010-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: python scripts/ci/ascend950.py --phase cpu --output "$RUNNER_TEMP/cpu-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ascend950-cpu
          path: ${{ runner.temp }}/cpu-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ascend950-toolchain-cpu
          path: ${{ runner.temp }}/toolchain-cpu.json
  pr-performance:
    needs: [sources, preflight]
    if: needs.sources.outputs.performance_required == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'performance'))
    runs-on: [self-hosted, tileops-npu-server2, ascend950-32core]
    timeout-minutes: 1440
    steps:
      - name: Restore checksum-verified source archives from this host
        id: archive-cache
        env:
          ARCHIVE_DIGEST: ${{ needs.sources.outputs.archive_digest }}
          ARCHIVES: ${{ runner.temp }}/ci-archives-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          CACHE_ROOT: /opt/tileops-ci/server2-20261030/cache/source-archives-v1
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, re
          hit = False
          try:
              digest = os.environ["ARCHIVE_DIGEST"]
              if not re.fullmatch(r"[0-9a-f]{64}", digest): raise ValueError("Invalid manifest digest")
              entry = pathlib.Path(os.environ["CACHE_ROOT"]) / digest
              manifest = (entry / "SHA256SUMS").read_bytes()
              if hashlib.sha256(manifest).hexdigest() != digest: raise ValueError("Manifest checksum mismatch")
              entries = [line.split() for line in manifest.decode().splitlines()]
              expected = {"source.commit", "source.tar.gz", "harness.tar.gz", "baseline.tar.gz"}
              if len(entries) != 4 or any(len(e) != 2 for e in entries) or {e[1] for e in entries} != expected:
                  raise ValueError("Unexpected archive members")
              payload = {name: (entry / name).read_bytes() for _, name in entries}
              if any(hashlib.sha256(payload[name]).hexdigest() != sha for sha, name in entries):
                  raise ValueError("Archive checksum mismatch")
              destination = pathlib.Path(os.environ["ARCHIVES"])
              destination.mkdir(parents=True, exist_ok=True)
              for name, content in {**payload, "SHA256SUMS": manifest}.items():
                  (destination / name).write_bytes(content)
              hit = True
          except (OSError, ValueError, UnicodeError) as exc:
              print(f"Source archive cache miss: {exc}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"hit={str(hit).lower()}\n")
          PY
      - uses: actions/download-artifact@v4
        if: steps.archive-cache.outputs.hit != 'true'
        with:
          name: ascend950-sources
          path: ${{ runner.temp }}/ci-archives-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: Unpack verified sources
        env:
          ARCHIVE_DIGEST: ${{ needs.sources.outputs.archive_digest }}
          ARCHIVES: ${{ runner.temp }}/ci-archives-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          DESTINATION: ${{ runner.temp }}/ci-v010-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          cd "$ARCHIVES"
          echo "$ARCHIVE_DIGEST  SHA256SUMS" | sha256sum --check
          sha256sum --check SHA256SUMS
          mkdir -p "$DESTINATION"
          tar --no-same-owner -xzf source.tar.gz -C "$DESTINATION"
          test "$(git -C "$DESTINATION" rev-parse HEAD)" = "$(cat source.commit)"
          test -z "$(git -C "$DESTINATION" status --porcelain)"
          mkdir -p "$DESTINATION/ci-harness" "$DESTINATION/baseline-cache"
          tar --no-same-owner -xzf harness.tar.gz -C "$DESTINATION/ci-harness"
          tar --no-same-owner -xzf baseline.tar.gz -C "$DESTINATION/baseline-cache"
      - name: Publish verified archives to this host cache
        continue-on-error: true
        working-directory: ${{ runner.temp }}/ci-v010-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        env:
          ARCHIVE_DIGEST: ${{ needs.sources.outputs.archive_digest }}
          ARCHIVES: ${{ runner.temp }}/ci-archives-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          CACHE_HELPER=ci-harness/scripts/ci/artifact_cache.py
          if [[ ! -f "$CACHE_HELPER" ]]; then CACHE_HELPER=scripts/ci/artifact_cache.py; fi
          python "$CACHE_HELPER" --archives "$ARCHIVES" --cache-root /opt/tileops-ci/server2-20261030/cache/source-archives-v1 --digest "$ARCHIVE_DIGEST"
      - name: Verify published baseline snapshot
        working-directory: ${{ runner.temp }}/ci-v010-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          echo "1ca42118cf451200aa0f0aa75d1880501c6832132aa838aedacf0886872a52da  baseline-cache/data/baseline-cache/snapshot.json" | sha256sum --check
      - name: Changed operator performance with final-output correctness
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha || 'origin/ascend950-v0.1.0' }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MANUAL_OPERATORS: ${{ github.event_name == 'workflow_dispatch' && inputs.operators || '' }}
        working-directory: ${{ runner.temp }}/ci-v010-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -eo pipefail
          source /opt/tileops-ci/server2-20261030/config/prepare-python.sh "$PWD"
          source /opt/tileops-ci/server2-20261030/config/toolchain-v1.env.sh
          export OMP_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4
          export ASCEND950_GOLDEN_CACHE_DIR=/opt/tileops-ci/golden-reference-v1
          export ASCEND950_GOLDEN_CACHE_MAX_BYTES=274877906944
          export ASCEND950_GOLDEN_CACHE_MIN_FREE_BYTES=214748364800
          TORCH_DEVICE_BACKEND_AUTOLOAD=0 python /opt/tileops-ci/server2-20261030/config/check-toolchain-v1.py --lock /opt/tileops-ci/server2-20261030/config/toolchain-v1.lock.json --output "$RUNNER_TEMP/pr-toolchain.json"
          # PR events test a synthetic merge. Its first parent is the base actually
          # tested, which may be newer than the event payload's base SHA.
          if [[ -n "$PR_HEAD" ]]; then
            read -r -a parents <<< "$(git show -s --format=%P HEAD)"
            [[ "${#parents[@]}" -eq 2 && "${parents[1]}" == "$PR_HEAD" ]] || { echo "Unexpected PR merge parents" >&2; exit 1; }
            PR_BASE="${parents[0]}"
          fi
          git rev-parse "$PR_BASE^{commit}" > "$RUNNER_TEMP/pr-selection-base.txt"
          # Prefer the trusted harness; candidate fallback bootstraps this CPU-only
          # helper for its introducing PR. The measurement harness stays trusted.
          CACHE_KEY_SCRIPT=ci-harness/scripts/ci/tilelang_cache_key.py
          if [[ ! -f "$CACHE_KEY_SCRIPT" ]]; then CACHE_KEY_SCRIPT=scripts/ci/tilelang_cache_key.py; fi
          TILELANG_CACHE_KEY="$(python "$CACHE_KEY_SCRIPT" --source "$PWD" --lock /opt/tileops-ci/server2-20261030/config/toolchain-v1.lock.json --verified-toolchain "$RUNNER_TEMP/pr-toolchain.json" --output "$RUNNER_TEMP/pr-cache.json")"
          export TILELANG_CACHE_DIR="/opt/tileops-ci/server2-20261030/cache/tilelang-v1-${TILELANG_CACHE_KEY}"
          mkdir -p "$TILELANG_CACHE_DIR"
          CHECKPOINTS=ci-harness/.github/ci/pr_checkpoints.py
          if [[ ! -f "$CHECKPOINTS" ]]; then CHECKPOINTS=.github/ci/pr_checkpoints.py; fi
          echo "e8b3280f7f1eee6b5a3e4f0fd2e0d9f3229db8b46b8e4fbc7992b9a92c02ce18  $CHECKPOINTS" | sha256sum --check
          python -I "$CHECKPOINTS" measure --cache "$RUNNER_TEMP/pr-cache.json" --toolchain "$RUNNER_TEMP/pr-toolchain.json" --prior baseline-cache/data/baseline-cache/prior-checkpoints.json --operators "$MANUAL_OPERATORS" --base "$PR_BASE" --baseline baseline-cache/data/baseline-cache/snapshot.json --output "/opt/tileops-ci/server2-20261030/pr-evidence-v010/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ascend950-pr-checkpoints-${{ github.run_attempt }}
          path: /opt/tileops-ci/server2-20261030/pr-evidence-v010/${{ github.run_id }}-${{ github.run_attempt }}/checkpoint-index.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ascend950-pr-performance
          path: |
            /opt/tileops-ci/server2-20261030/pr-evidence-v010/${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/pr-toolchain.json
            ${{ runner.temp }}/pr-cache.json
            ${{ runner.temp }}/pr-selection-base.txt
          retention-days: 90
  device:
    needs: [sources, preflight]
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'cpu' && inputs.mode != 'performance')
    runs-on: [self-hosted, tileops-npu-server2, ascend950-32core]
    timeout-minutes: 180
    concurrency:
      group: ascend950-device
      cancel-in-progress: false
    steps:
      - name: Restore checksum-verified source archives from this host
        id: archive-cache
        env:
          ARCHIVE_DIGEST: ${{ needs.sources.outputs.archive_digest }}
          ARCHIVES: ${{ runner.temp }}/ci-archives-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          CACHE_ROOT: /opt/tileops-ci/server2-20261030/cache/source-archives-v1
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, re
          hit = False
          try:
              digest = os.environ["ARCHIVE_DIGEST"]
              if not re.fullmatch(r"[0-9a-f]{64}", digest): raise ValueError("Invalid manifest digest")
              entry = pathlib.Path(os.environ["CACHE_ROOT"]) / digest
              manifest = (entry / "SHA256SUMS").read_bytes()
              if hashlib.sha256(manifest).hexdigest() != digest: raise ValueError("Manifest checksum mismatch")
              entries = [line.split() for line in manifest.decode().splitlines()]
              expected = {"source.commit", "source.tar.gz", "harness.tar.gz", "baseline.tar.gz"}
              if len(entries) != 4 or any(len(e) != 2 for e in entries) or {e[1] for e in entries} != expected:
                  raise ValueError("Unexpected archive members")
              payload = {name: (entry / name).read_bytes() for _, name in entries}
              if any(hashlib.sha256(payload[name]).hexdigest() != sha for sha, name in entries):
                  raise ValueError("Archive checksum mismatch")
              destination = pathlib.Path(os.environ["ARCHIVES"])
              destination.mkdir(parents=True, exist_ok=True)
              for name, content in {**payload, "SHA256SUMS": manifest}.items():
                  (destination / name).write_bytes(content)
              hit = True
          except (OSError, ValueError, UnicodeError) as exc:
              print(f"Source archive cache miss: {exc}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"hit={str(hit).lower()}\n")
