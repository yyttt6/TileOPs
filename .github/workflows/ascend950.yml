name: Ascend 950

on:
  push:
    branches: [ascend950]
  pull_request:
    branches: [ascend950]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ascend950-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure
      - name: Install contract dependencies
        run: pip install -e '.[dev]' -c constraints.txt
      - name: CPU contracts
        run: python scripts/ci/ascend950.py --phase cpu --output "$RUNNER_TEMP/ascend950-cpu"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ascend950-cpu
          path: ${{ runner.temp }}/ascend950-cpu
          if-no-files-found: warn

  npu-correctness:
    needs: preflight
    if: github.repository == 'yyttt6/TileOPs' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, ascend-950]
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the actual checkout on Ascend 950
        shell: bash
        run: |
          set -eo pipefail
          test -n "$ASCEND_ENV_SCRIPT"
          source "$ASCEND_ENV_SCRIPT"
          python scripts/ci/ascend950.py --phase device --output "$RUNNER_TEMP/ascend950-device-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ascend950-device
          path: ${{ runner.temp }}/ascend950-device-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
